name: CI

on:
  push:
    branches: [main]
    tags: [final]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck + Vitest. The sandbox images are built first so the security tests really run
  # (they skip themselves when Docker or the images are missing).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: judgehint
          POSTGRES_PASSWORD: judgehint
          POSTGRES_DB: judgehint
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U judgehint" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm typecheck
      - run: pnpm build:sandbox
      - run: pnpm test
      - run: pnpm --filter @judgehint/web build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: judgehint
          POSTGRES_PASSWORD: judgehint
          POSTGRES_DB: judgehint
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U judgehint" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm build:sandbox
      - run: pnpm --filter @judgehint/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/stack.log
          retention-days: 7

  # Proves the production images still build (the stack the README starts with one command).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
